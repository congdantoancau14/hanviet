<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title id="page-title">Tự Điển Chữ Nôm Trích Dẫn - Lookup Tool</title>
    
    <!-- Dùng CDN Bootstrap để không bị lỗi FILE_NOT_FOUND -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Bungee+Shade&display=swap" rel="stylesheet">
    
    <!-- File cơ sở dữ liệu tách riêng -->
    <script src="db.js"></script>
	<!-- <script type="module" src="db.js"></script> -->

    <style>
        .navbar {
            border-radius: 0;
        }

        .page-info .btn {
            width: 100%;
        }

        .center {
            margin: 0 auto;
            padding: 20px;
            text-align: center;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .icon {
            font-size: 3em;
        }

        .page {
            color: royalblue;
        }

        .side-crop {
            max-width: 60%;
            overflow: hidden;
        }

        .side-crop img {
            max-width: initial;
        }

        .right-crop {
            direction: rtl;
        }

        .margin-left {
            margin-left: 15%;
        }

        .margin-right {
            margin-right: 15%;
        }

        .panel {
            position: fixed;
            top: 62px;
            background: rgba(255, 255, 255, .5);
            padding: 0px 24px;
            height: 80%;
            cursor: pointer;
            user-select: none; /* Bỏ chọn text bằng CSS thuần */
            -webkit-user-select: none;
            z-index: 10;
        }

        .panel:hover {
            background: rgb(231, 197, 146);
        }

        .left-side {
            left: 0;
        }

        .right-side {
            right: 0;
        }

        .vertical-text {
            color: #4b13d8;
            font-family: 'Bungee Shade', cursive;
            -webkit-writing-mode: vertical-lr;
            -ms-writing-mode: tb-lr;
            writing-mode: vertical-lr;
            text-orientation: upright;
            -webkit-font-feature-settings: "vkrn", "vpal";
            font-feature-settings: "vkrn", "vpal";
            font-size: 2em;
            text-align: center;
        }

        .img {
            position: absolute;
            right: 0;
            left: 0;
            transition: all 0.2s ease-in-out; /* Dùng CSS Transition thay jQuery animate */
        }

        body,
        .page-container {
            position: relative;
            min-height: 100vh;
        }

        body {
            background: url('https://images.unsplash.com/photo-1486723312829-f32b4a25211b?dpr=2&auto=format&fit=crop&w=1500&h=1000&q=80&cs=tinysrgb&crop=&bg=') no-repeat center center fixed;
            background-size: cover;
        }

        .main {
            padding-bottom: 60px;
        }

        .origin {
            max-width: 100%;
            height: auto;
        }

        footer {
            background-color: rgb(47, 54, 88);
            padding: 20px;
            text-align: center;
            color: white;
            position: absolute;
            bottom: 0px;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <nav class="navbar navbar-inverse">
            <div class="container-fluid">
                <div class="navbar-header">
                    <a class="navbar-brand" href="index.html">WebSiteName</a>
                </div>
                <ul class="nav navbar-nav">
                    <li class="active">
                        <a href="index.html">Home</a>
                    </li>
                    <li>
                        <a href="#words">Search by words</a>
                    </li>
                    <li>
                        <a href="#about">About</a>
                    </li>
                </ul>
                <form class="navbar-form navbar-left" id="search-form" onsubmit="handleSearch(event)">
                    <div class="form-group">
                        <input id="search-input" name="keyword" type="text" class="form-control" placeholder="Input keyword or page">
                    </div>
                    <button type="submit" class="btn btn-default">Search</button>
                </form>
                <ul class="nav navbar-nav navbar-right">
                    <li>
                        <a href="#"><span class="glyphicon glyphicon-plus-sign"></span> Add char</a>
                    </li>
                    <li>
                        <a href="#"><span class="glyphicon glyphicon-user"></span> Sign Up</a>
                    </li>
                    <li>
                        <a href="#"><span class="glyphicon glyphicon-log-in"></span> Login</a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="main" id="main-content">
            <!-- Nội dung sẽ render động bằng JavaScript -->
        </div>

        <footer id="app-footer" class="hidden">
            <div class="footer">
                <span>&copy Fiong 2018 | </span>
                <span>
                    Trang nguồn (Đặng Thế Kiệt):
                    <a href="http://vietnamtudien.org/chunom-trichdan/" target="_blank">vietnamtudien.org/chunom_trichdan</a>
                </span>
            </div>
        </footer>
    </div>

    <!-- Script Pure Vanilla JavaScript -->
    <script>
        const MAX_PAGE = 1498;

        // 1. CÁC HÀM XỬ LÝ GIAO DIỆN CHUYỂN CẮT TRANG (VANILLA JS)
        function showLeft() {
            const fullImg = document.querySelector('.full-image');
            const leftPart = document.querySelector('.left-part');
            const rightPart = document.querySelector('.right-part');

            if (fullImg) fullImg.classList.add('hidden');
            if (rightPart) rightPart.classList.add('hidden');

            if (leftPart) {
                leftPart.classList.remove('hidden');
                leftPart.style.left = '0px';
                leftPart.style.right = '';
            }
        }

        function showRight() {
            const fullImg = document.querySelector('.full-image');
            const leftPart = document.querySelector('.left-part');
            const rightPart = document.querySelector('.right-part');

            if (fullImg) fullImg.classList.add('hidden');
            if (leftPart) leftPart.classList.add('hidden');

            if (rightPart) {
                rightPart.classList.remove('hidden');
                rightPart.style.right = '0px';
                rightPart.style.left = '';
            }
        }

        function showFull() {
            const fullImg = document.querySelector('.full-image');
            const leftPart = document.querySelector('.left-part');
            const rightPart = document.querySelector('.right-part');

            if (leftPart) leftPart.classList.add('hidden');
            if (rightPart) rightPart.classList.add('hidden');
            if (fullImg) fullImg.classList.remove('hidden');
        }

        function setupInteractions() {
            const leftSide = document.querySelector('.left-side');
            const rightSide = document.querySelector('.right-side');

            if (leftSide) {
                leftSide.addEventListener('click', () => {
                    const leftPart = document.querySelector('.left-part');
                    if (leftPart && leftPart.classList.contains('hidden')) {
                        showLeft();
                    } else {
                        showFull();
                    }
                });
            }

            if (rightSide) {
                rightSide.addEventListener('click', () => {
                    const rightPart = document.querySelector('.right-part');
                    if (rightPart && rightPart.classList.contains('hidden')) {
                        showRight();
                    } else {
                        showFull();
                    }
                });
            }

            document.onkeyup = (e) => {
                if (e.keyCode === 37) showLeft();  // Mũi tên trái
                if (e.keyCode === 39) showRight(); // Mũi tên phải
            };
        }

        // 2. HÀM XỬ LÝ LOGIC TÌM KIẾM DỮ LIỆU
        function getRowByKeyword(keyword) {
            if (typeof db_trichdan === 'undefined' || !Array.isArray(db_trichdan)) return null;
            return db_trichdan.find(item => item.keyword.toLowerCase() === keyword.toLowerCase()) || null;
        }

        function formatPageNumber(page) {
            let p = parseInt(page, 10);
            if (isNaN(p)) return 0;

            if (p > 0 && p < 10) return '000' + p;
            if (p < 100) return '00' + p;
            if (p < 1000) return '0' + p;
            return '' + p;
        }

        function processSearch(keyword) {
            let page = 0;
            let string_page = null;

            if (keyword) {
                if (!isNaN(keyword)) {
                    page = parseInt(keyword, 10);
                } else {
                    const row = getRowByKeyword(keyword);
                    if (row) {
                        string_page = row.page.substring(2, 6);
                    } else {
                        page = -1;
                    }
                }
            }

            if (string_page) {
                page = string_page;
            } else if (page > 0) {
                page = formatPageNumber(page);
            }

            return page;
        }

        // 3. RENDER GIAO DIỆN DỰA TRÊN URL
        function renderUI() {
            const urlParams = new URLSearchParams(window.location.search);
            let keyword = urlParams.get('keyword');
            let pageParam = urlParams.get('page');

            let rawInput = keyword !== null ? keyword : pageParam;
            let page = processSearch(rawInput);

            let intPage = parseInt(page, 10);
            let header = '';
            let title = '';
            let imgurl = '';
            let mainHtml = '';
            const appFooter = document.getElementById('app-footer');

            if (intPage > 0 && intPage <= MAX_PAGE) {
                header = `Đang hiển thị trang <span class="page">${page}</span>`;
                title = `Trang ${page}`;
                if (appFooter) appFooter.classList.add('hidden');

                let prevPage = intPage - 1;
                let nextPage = intPage + 1;

                mainHtml = `
                    <div class="page-info">
                        <div class="container">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="center">
                                        <h2>${header}</h2>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="change-page center">
                                        <div class="row">
                                            <div class="col-md-6">
                                                <a class="btn btn-primary" href="index.html?page=${prevPage}">
                                                    <div class="icon">⇦</div>
                                                </a>
                                            </div>
                                            <div class="col-md-6">
                                                <a class="btn btn-primary" href="index.html?page=${nextPage}">
                                                    <div class="icon">⇨</div>
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="img full-image">
                        <img class="img-responsive center" src="http://vietnamtudien.org/chunom-trichdan/tr${page}.png" alt="Tự điển Chữ Nôm Trích dẫn trang ${page}" />
                    </div>

                    <div class="panel left-side vertical-text">TRÁI</div>
                    <div class="panel right-side vertical-text">PHẢI</div>

                    <div class="img side-crop left-part center hidden">
                        <img src="http://vietnamtudien.org/chunom-trichdan/tr${page}.png" alt="Tự điển Chữ Nôm Trích dẫn nửa trang ${page}">
                    </div>
                    <div class="img side-crop right-part right-crop center hidden">
                        <img src="http://vietnamtudien.org/chunom-trichdan/tr${page}.png" alt="Tự điển Chữ Nôm Trích dẫn nửa trang ${page}">
                    </div>
                `;
            } else if (intPage === 0) {
                imgurl = "http://vietnamtudien.org/chunom-trichdan/tdcntd-biatruoc.jpg";
                title = 'Trang bìa';
                header = 'Bắt đầu bằng cách nhập số trang hoặc từ khóa vào khung tìm kiếm và nhấn phím Enter';
                if (appFooter) appFooter.classList.remove('hidden');

                mainHtml = `
                    <div class="container">
                        <h2>${header}</h2>
                        <img class="center origin" src="${imgurl}" alt="Trang bìa Tự điển Chữ Nôm Trích dẫn">
                    </div>
                `;
            } else {
                header = 'Không tìm thấy trang';
                title = 'Không tìm thấy trang';
                imgurl = 'https://learn.getgrav.org/user/pages/11.troubleshooting/01.page-not-found/error-404.png';
                if (appFooter) appFooter.classList.remove('hidden');

                mainHtml = `
                    <div class="container">
                        <h2>${header}</h2>
                        <img class="center origin" src="${imgurl}" alt="Không tìm thấy">
                    </div>
                `;
            }

            document.title = `${title} - Tự Điển Chữ Nôm Trích Dẫn - Lookup Tool`;
            document.getElementById('main-content').innerHTML = mainHtml;

            if (intPage > 0 && intPage <= MAX_PAGE) {
                setupInteractions();
            }
        }

        function handleSearch(e) {
			e.preventDefault();
			const keyword = document.getElementById('search-input').value.trim();
			if (keyword) {
				// 1. Cập nhật URL trên thanh địa chỉ mà không làm tải lại trang
				const newUrl = `index.html?keyword=${encodeURIComponent(keyword)}`;
				window.history.pushState({ path: newUrl }, '', newUrl);
				
				// 2. Render lại giao diện trực tiếp
				renderUI();
			}
		}

		// Lắng nghe sự kiện người dùng bấm nút Back/Forward trên trình duyệt
		window.addEventListener('popstate', () => {
			renderUI();
		});

        // Tự động chạy khi DOM sẵn sàng
        document.addEventListener('DOMContentLoaded', () => {
            renderUI();
        });
    </script>
</body>

</html>
